name: sirius-argus

# Сетевая изоляция (ADR-0005): наружу торчит только reverse-proxy (и serving в И4).
# Профили: без профиля = core (MVP); profile "full" добавляет observability + Gitea.
networks:
  internal:
    internal: true
  edge: {}

volumes:
  pg_data: {}
  kc_pg_data: {}
  minio_data: {}
  redis_data: {}
  grafana_data: {}
  mlflow_pg_data: {}

services:
  # ---------- core ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sirius
      POSTGRES_USER: ${POSTGRES_USER:-sirius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirius}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sirius}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  control-plane:
    build: ./control-plane
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sirius}:${POSTGRES_PASSWORD:-sirius}@postgres:5432/sirius
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/sirius/protocol/openid-connect/certs
      REDIS_URL: redis://:${REDIS_PASSWORD:-sirius-redis}@redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CI_WEBHOOK_SECRET: ${CI_WEBHOOK_SECRET:-change-me-ci-webhook}
      GITEA_BASE_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      SIGNING_SEED: ${SIGNING_SEED:-}
      DEPS_AUDIT_ONLINE: ${DEPS_AUDIT_ONLINE:-0}
      DEV_AUTH: ${DEV_AUTH:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mlflow:
        condition: service_started
    networks: [internal]   # наружу не публикуется — только через reverse-proxy

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes: [kc_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${KC_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-sirius-redis}"]
    volumes: [redis_data:/data]
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sirius}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-sirius-minio}
    volumes: [minio_data:/data]
    networks: [internal]

  mlflow-db:
    image: postgres:17-alpine
    # Своя БД: таблицы MLflow (datasets, model_versions) не должны пересекаться
    # с таблицами control-plane в БД sirius.
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    volumes: [mlflow_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${MLFLOW_DB_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mlflow:
    build: ./infra/mlflow   # psycopg2/boto3 запечены в образ (рантайм без egress)
    command:
      - sh
      - -c
      - >
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/mlflow
        --artifacts-destination s3://mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-sirius}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-sirius-minio}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks: [internal]

  serving:
    build: ./serving   # 3 НЕ-генеративные модели (sklearn, CPU) за рантайм-защитами
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      SERVICE_TOKEN: ${SERVING_SERVICE_TOKEN:-dev:serving:MLSecOps}
    depends_on: [control-plane]
    ports:
      - "8001:8000"   # сервинг — второй внешний контур (кроме reverse-proxy), И4
    networks: [internal, edge]

  reverse-proxy:
    image: caddy:2-alpine
    volumes:
      - ./infra/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"   # единственная точка входа для людей
    depends_on: [control-plane]
    networks: [internal, edge]

  # ---------- full: observability + git ----------
  loki:
    image: grafana/loki:3.2.0
    networks: [internal]
    profiles: [full]

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [internal]
    profiles: [full]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal]
    profiles: [full]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [loki, prometheus]
    ports:
      - "3000:3000"
    networks: [internal, edge]
    profiles: [full]

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3001/
    volumes:
      - ./infra/gitea-data:/data
    ports:
      - "3001:3000"
    networks: [internal, edge]
    profiles: [full]
