name: sirius-argus

# Сетевая изоляция (ADR-0005): наружу торчит только reverse-proxy (и serving в И4).
# Профили: без профиля = core (MVP); profile "full" добавляет observability + Gitea.
networks:
  internal:
    internal: true
  # RT-06: отдельный изолированный тир «рантайм» — serving↔control-plane, без доступа
  # к MLflow/MinIO/БД. Боковое движение из сервинга к хранилищам отрезано на уровне сети.
  runtime:
    internal: true
  edge: {}
  # Отдельная публикующая сеть для веб-консоли MinIO на хост. НЕ общая с edge (где serving):
  # иначе serving делил бы сеть с MinIO и мог достать его S3 — пробой RT-06 (сегментация рантайма).
  edge-minio: {}

volumes:
  pg_data: {}
  kc_pg_data: {}
  minio_data: {}
  redis_data: {}
  grafana_data: {}
  loki_data: {}
  mlflow_pg_data: {}
  vault_creds: {}  # AppRole role_id/secret_id: vault-init пишет, control-plane читает

services:
  # ---------- core ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sirius
      POSTGRES_USER: ${POSTGRES_USER:-sirius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirius}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sirius}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  control-plane:
    build: ./control-plane
    security_opt: ["no-new-privileges:true"]   # AUD-16: запрет повышения привилегий (образ уже non-root)
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sirius}:${POSTGRES_PASSWORD:-sirius}@postgres:5432/sirius
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/sirius/protocol/openid-connect/certs  # /auth — Keycloak под relative-path
      REDIS_URL: redis://:${REDIS_PASSWORD:-sirius-redis}@redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_AUTH_USER:-sirius-cp}      # basic-auth к реестру (тот же юзер, что у mlflow)
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_AUTH_PASSWORD:-mlflow-auth-dev}
      CI_WEBHOOK_SECRET: ${CI_WEBHOOK_SECRET:-change-me-ci-webhook}
      GITEA_BASE_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      SIGNING_SEED: ${SIGNING_SEED:-}
      DEPS_AUDIT_ONLINE: ${DEPS_AUDIT_ONLINE:-0}
      DEV_AUTH: ${DEV_AUTH:-0}
      SERVICE_TOKEN: ${SIRIUS_SERVICE_TOKEN:-svc-serving-local-dev-7f3a9c}  # сервис-аккаунт сервинга (=serving)
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-sirius}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-sirius-minio}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-sirius-quarantine}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}  # AUD-20: 2 ГиБ по умолчанию (не 0/без лимита) — guard от resource-exhaustion, но реальные модели проходят. Малый лимит для DOS-02-теста — в docker-compose.test.yml
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}  # секреты из Vault по AppRole (фолбэк на env выше)
    volumes:
      - vault_creds:/vault-creds:ro  # AppRole role_id/secret_id от vault-init
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      mlflow:
        condition: service_started
      vault-init:
        condition: service_completed_successfully   # секреты засеяны до старта control-plane
    networks: [internal, runtime]   # internal — к БД/MLflow/MinIO/Vault; runtime — приём событий от serving

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes: [kc_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${KC_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth   # Keycloak живёт под /auth → единая точка входа через Caddy (ADR-0005)
      KC_PROXY_HEADERS: xforwarded   # за reverse-proxy: внешние URL строить по X-Forwarded-* (localhost:8080/auth/...)
      KC_HOSTNAME: http://localhost:8080/auth    # фикс. внешний (frontend) URL С relative-path → стабильный issuer/redirect за Caddy
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"    # token/jwks по request-host (внутр. keycloak:8080) — split-horizon для контейнеров-клиентов
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [internal]

  # один-shot: заводит OIDC-клиентов ops-консолей (Grafana/Gitea/MinIO) в realm sirius
  # через Admin API — идемпотентно, без правки realm-sirius.json.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      HOME: /tmp   # kcadm пишет конфиг-токен в $HOME/.keycloak — /tmp гарантированно writable
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GRAFANA_OIDC_SECRET: ${GRAFANA_OIDC_SECRET:-grafana-oidc-dev}
      GITEA_OIDC_SECRET: ${GITEA_OIDC_SECRET:-gitea-oidc-dev}
      MINIO_OIDC_SECRET: ${MINIO_OIDC_SECRET:-minio-oidc-dev}
    entrypoint: ["/bin/sh", "/clients-init.sh"]
    volumes:
      - ./infra/keycloak/clients-init.sh:/clients-init.sh:ro
    depends_on: [keycloak]
    networks: [internal]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-sirius-redis}"]
    volumes: [redis_data:/data]
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sirius}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-sirius-minio}
      # OIDC-клиент для S3-API (STS AssumeRoleWithWebIdentity, claim "policy"=consoleAdmin через маппер).
      # ВНИМАНИЕ: вход в саму ВЕБ-КОНСОЛЬ — root (см. ниже): community-образ (RELEASE.2025-09+) вырезал
      # OIDC-логин консоли (/api/v1/login/oauth2/auth → 404) — апстрим, не конфиг. Решение в ADR-0012.
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/auth/realms/sirius/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: ${MINIO_OIDC_SECRET:-minio-oidc-dev}
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
      MINIO_IDENTITY_OPENID_SCOPES: "openid,email,profile"
      MINIO_IDENTITY_OPENID_REDIRECT_URI: http://localhost:9001/oauth_callback
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Keycloak
    volumes: [minio_data:/data]
    ports:
      - "127.0.0.1:9001:9001"   # AUD-17: веб-консоль MinIO только на loopback (вход root; доступ — SSH-туннель, ADR-0012)
    networks: [internal, edge-minio]   # edge-minio — публикация консоли на хост; НЕ общий edge с serving (RT-06)

  # один-shot: заводит сервис-юзера MLflow с политикой ТОЛЬКО на s3://mlflow (least privilege,
  # MLflow не ходит под root-кредами MinIO). Идемпотентно.
  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sirius}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-sirius-minio}
      MLFLOW_S3_USER: ${MLFLOW_S3_USER:-mlflow-svc}
      MLFLOW_S3_PASSWORD: ${MLFLOW_S3_PASSWORD:-mlflow-s3-dev}
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    volumes:
      - ./infra/minio/init.sh:/minio-init.sh:ro
    depends_on: [minio]
    networks: [internal]
    restart: "no"

  mlflow-db:
    image: postgres:17-alpine
    # Своя БД: таблицы MLflow (datasets, model_versions) не должны пересекаться
    # с таблицами control-plane в БД sirius.
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    volumes: [mlflow_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${MLFLOW_DB_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mlflow:
    build: ./infra/mlflow   # psycopg2/boto3 запечены в образ; entrypoint поднимает basic-auth
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_USER:-mlflow-svc}        # scoped-юзер MinIO (только s3://mlflow), не root
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_PASSWORD:-mlflow-s3-dev}
      # basic-auth реестра: control-plane ходит под этими кредами (см. ниже MLFLOW_TRACKING_*)
      MLFLOW_AUTH_ADMIN_USERNAME: ${MLFLOW_AUTH_USER:-sirius-cp}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_AUTH_PASSWORD:-mlflow-auth-dev}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully   # scoped-юзер MLflow заведён до старта
    networks: [internal]

  serving:
    build: ./serving   # 3 НЕ-генеративные модели (sklearn, CPU) за рантайм-защитами
    security_opt: ["no-new-privileges:true"]   # AUD-16: запрет повышения привилегий (образ уже non-root)
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      SERVICE_TOKEN: ${SIRIUS_SERVICE_TOKEN:-svc-serving-local-dev-7f3a9c}  # тот же сервис-токен, что валидирует control-plane
    depends_on: [control-plane]
    ports:
      - "8001:8000"   # сервинг — второй внешний контур (кроме reverse-proxy), И4
    networks: [runtime, edge]   # RT-06: только control-plane (runtime) + внешний контур (edge); НЕ internal

  reverse-proxy:
    image: caddy:2-alpine
    volumes:
      - ./infra/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"   # единственная точка входа для людей
    depends_on: [control-plane]
    networks: [internal, edge]

  # ---------- секрет-менеджмент ----------
  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-sirius-root-dev}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["server", "-dev"]   # dev-режим (auto-unseal, фикс. токен) — воспроизводимо; прод = file/raft+auto-unseal
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  vault-init:
    image: hashicorp/vault:1.18
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-sirius-root-dev}
      SIGNING_SEED: ${SIGNING_SEED:-5e1f17a05e1f17a0c0ffee}
      SIRIUS_SERVICE_TOKEN: ${SIRIUS_SERVICE_TOKEN:-svc-serving-local-dev-7f3a9c}
    entrypoint: ["/bin/sh", "/init.sh"]   # seed: audit + approle + policy + KV
    volumes:
      - ./infra/vault/init.sh:/init.sh:ro
      - vault_creds:/vault-creds
    depends_on:
      vault:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  # ---------- full: observability + git ----------
  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki     # персистентность логов + ретеншн (раньше тома не было)
    networks: [internal]
    profiles: [full]

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [internal]
    profiles: [full]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal]
    profiles: [full]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # единый вход через Keycloak (split-horizon: auth — через Caddy для браузера, token/userinfo — внутр.)
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_SECRET:-grafana-oidc-dev}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile roles"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:8080/auth/realms/sirius/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/sirius/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/auth/realms/sirius/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'MLSecOps') && 'Admin' || contains(roles[*], 'CEO') && 'Viewer' || 'Viewer'"  # фолбэк = Viewer (read-only), не Editor — иначе любой realm-юзер мог править
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [loki, prometheus]
    ports:
      - "3000:3000"
    networks: [internal, edge]
    profiles: [full]

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__security__INSTALL_LOCK: "true"   # пропустить визард — стек поднимается готовым (turnkey)
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"   # OIDC-юзер заводится сам при первом входе
      GITEA__oauth2_client__ACCOUNT_LINKING: auto              # линковать по email с существующим аккаунтом
      GITEA__oauth2_client__USERNAME: preferred_username
    volumes:
      - ./infra/gitea-data:/data
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 40
    networks: [internal, edge]
    profiles: [full]

  # один-shot: создаёт admin-юзера Gitea (идемпотентно, с ретраями) → без ручной регистрации
  gitea-init:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - ./infra/gitea-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        for i in $$(seq 1 10); do
          OUT=$$(su git -c "gitea admin user create --admin --username '${GITEA_ADMIN_USER:-sirius}' --password '${GITEA_ADMIN_PASSWORD:-change-me-gitea}' --email admin@sirius.local --must-change-password=false" 2>&1)
          echo "$$OUT"
          case "$$OUT" in *successfully*|*already*) break ;; esac
          sleep 3
        done
        if su git -c "gitea admin auth list" 2>/dev/null | grep -qiw keycloak; then
          echo 'gitea-init: OIDC-источник keycloak уже есть'
        else
          su git -c "gitea admin auth add-oauth --name keycloak --provider openidConnect --key gitea --secret '${GITEA_OIDC_SECRET:-gitea-oidc-dev}' --auto-discover-url http://keycloak:8080/auth/realms/sirius/.well-known/openid-configuration --scopes 'openid profile email'" && echo 'gitea-init: OIDC-источник keycloak добавлен'
        fi
    depends_on:
      gitea:
        condition: service_healthy
    networks: [internal]
    profiles: [full]
    restart: "no"
